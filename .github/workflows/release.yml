name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_version:
        description: 'Deploy trunk to WordPress.org SVN as this version (must equal Stable tag). Empty = build the zip only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  zip:
    name: Build distributable zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Stage plugin files
        run: |
          SLUG=tribar-connector-for-typesafe-jev
          mkdir -p build/$SLUG
          rsync -a --exclude-from=.distignore ./ build/$SLUG/
          cd build && zip -rq $SLUG.zip $SLUG

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tribar-connector-for-typesafe-jev
          path: build/tribar-connector-for-typesafe-jev.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/tribar-connector-for-typesafe-jev.zip
          generate_release_notes: true

      # Tag pushes deploy that tag; a manual run deploys only when given a
      # version. The action skips a version already in SVN tags/.
      - name: Check version matches Stable tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.deploy_version != ''
        run: |
          V="${{ inputs.deploy_version }}"
          V="${V:-${GITHUB_REF_NAME#v}}"
          grep -q "^Stable tag: $V$" readme.txt || { echo "Stable tag is not $V"; exit 1; }

      - name: Deploy to WordPress.org
        if: startsWith(github.ref, 'refs/tags/') || inputs.deploy_version != ''
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: tribar-connector-for-typesafe-jev
          VERSION: ${{ inputs.deploy_version }}
